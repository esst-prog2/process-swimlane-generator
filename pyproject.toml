[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-swimlane-generator"
version = "0.1.0"
description = "Generate linear department swimlane SVGs from Excel"
requires-python = ">=3.13"
dependencies = ["openpyxl>=3.1.5,<4"]

[project.scripts]
process-map = "process_swimlane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
